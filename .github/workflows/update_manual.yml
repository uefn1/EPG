name: Update Tigo Sports Paraguay EPG - Manual Only

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '実行理由 (任意)'
        required: false
        default: 'manual test'

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4 lxml

      - name: Generate EPG (APF Official) - Manual
        run: |
          python auto_epg_real.py
          ls -lh *.xml
          echo "---- preview ----"
          head -n 40 tigo_sports_paraguay_REAL_JST.xml

      - name: Commit to main (no gh-pages, no .nojekyll)
        run: |
          git config user.email "epg-bot@example.com"
          git config user.name "EPG Bot"
          git add -f tigo_sports_paraguay_REAL_JST.xml
          git add -f *.xml
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Manual EPG update: ${{ inputs.reason }} $(date -u +%Y-%m-%d_%H:%M) JST"
            git push origin main
          fi
          

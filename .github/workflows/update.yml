name: Update Tigo Sports Paraguay EPG Daily

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Generate REAL EPG (JST) - APF Official
        run: |
          python auto_epg_real.py
          ls -lh *.xml
          echo "--- XML head ---"
          head -n 20 tigo_sports_paraguay_REAL_JST.xml

      - name: Commit XML to main only (force add)
        run: |
          git config --local user.email "epg-bot@example.com"
          git config --local user.name "EPG Bot"
          git add -f tigo_sports_paraguay_REAL_JST.xml
          git add -f *.xml
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "EPG update $(date -u +%Y-%m-%d_%H:%M) JST - APF Fecha 15"
            git push origin main
          fi
          

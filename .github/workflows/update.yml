name: Update Tigo Sports Paraguay EPG Daily

on:
  schedule:
    - cron: '0 */2 * * *'  # 2時間毎
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Generate EPG (JST)
        run: |
          if [ -f auto_epg_real.py ]; then
            python auto_epg_real.py
          elif [ -f auto_epg_updater.py ]; then
            python auto_epg_updater.py
          else
            echo "No updater script found!"
            exit 1
          fi
          ls -lh *.xml

      - name: Commit and push
        run: |
          git config --local user.email "epg-bot@example.com"
          git config --local user.name "EPG Bot"
          git add *.xml || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "EPG update $(date -u +%Y-%m-%d_%H:%M) - every 2h"
            git push
          fi

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          

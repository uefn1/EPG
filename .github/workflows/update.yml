name: Update Tigo Sports Paraguay EPG Daily

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install requests beautifulsoup4 lxml

      - name: Generate EPG
        run: |
          if [ -f auto_epg_real.py ]; then
            python auto_epg_real.py
          elif [ -f auto_epg_real_v3_fixed.py ]; then
            python auto_epg_real_v3_fixed.py
          else
            echo "No script found"
            exit 1
          fi

      - name: Commit
        run: |
          git config user.email "epg-bot@example.com"
          git config user.name "EPG Bot"
          git add -f *.xml
          git diff --staged --quiet || git commit -m "EPG $(date -u +%Y-%m-%d_%H:%M) JST"
          git push origin HEAD:main
          
